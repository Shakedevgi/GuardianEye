<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; }
    a { color: #7fb0ff; } a:hover { color: #a8c8ff; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; }
    .lbl { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #6a737d; }
  </style>
</helmet>

<div style="width: 1024px; height: 768px; background: #0b0e12; display: flex; box-sizing: border-box; color: #d7dce2;">

  <div style="width: 244px; flex-shrink: 0; background: #0e1217; border-right: 1px solid #1b2029; padding: 20px 18px; display: flex; flex-direction: column; gap: 22px; box-sizing: border-box;">
    <div style="display: flex; flex-direction: column; gap: 5px;">
      <div class="lbl">room</div>
      <div style="font-size: 17px; color: #e8ecf1;">Living room</div>
      <div style="display: flex; align-items: center; gap: 7px; margin-top: 2px;">
        <div style="width: 7px; height: 7px; border-radius: 50%; background: #00ff00;"></div>
        <div class="mono" style="font-size: 12px; color: #8b949e;">camera live</div>
      </div>
    </div>
    <div style="height: 1px; background: #1b2029;"></div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div class="lbl">in play</div>
      <div style="padding: 12px; border: 1px solid #ff0000; background: rgba(255,0,0,0.09);">
        <div style="font-size: 15px; color: #ffffff;">Low table</div>
        <div class="mono" style="font-size: 12px; color: #ff8080; margin-top: 3px;">confirmed hazard</div>
      </div>
      <div style="padding: 12px; border: 1px solid #1b2029;">
        <div style="font-size: 15px;">Child #3</div>
        <div class="mono" style="font-size: 12px; color: #8b949e; margin-top: 3px;">closing since 14:31:07</div>
      </div>
    </div>
    <div style="flex-grow: 1;"></div>
    <div class="mono" style="font-size: 11px; color: #4f5761;">parent view</div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0;">

    <!-- the meter is the console's alarm: full-width, engine red, named -->
    <div style="height: 46px; flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 0 20px; background: #ff0000;">
      <div class="lbl" style="color: rgba(255,255,255,0.75);">risk</div>
      <div style="width: 240px; height: 8px; border-radius: 4px; background: rgba(0,0,0,0.28); overflow: hidden;">
        <div style="width: 94%; height: 100%; background: #ffffff;"></div>
      </div>
      <div class="mono" style="font-size: 14px; font-weight: 600; color: #ffffff;">RED</div>
      <div style="flex-grow: 1;"></div>
      <div style="font-size: 13px; color: #ffe0e0;">saving a clip</div>
    </div>

    <div style="height: 96px; flex-shrink: 0; display: flex; align-items: center; padding: 0 20px; background: #1a0708; border-bottom: 1px solid #3a1114;">
      <div style="font-size: 34px; line-height: 1.1; color: #ffffff;">He is at the <span style="color: #ff6b6b;">low table</span></div>
    </div>

    <div style="flex-grow: 1; position: relative; background: #0d1014; margin: 14px 20px; border: 3px solid #ff0000; overflow: hidden;">
      <div style="position: absolute; inset: 0; background: linear-gradient(#0f1319 0%, #0f1319 46%, #171c23 46%, #12161c 100%);"></div>
      <div style="position: absolute; left: 26px; top: 120px; width: 240px; height: 120px; background: #1b212a; border-radius: 8px 8px 3px 3px;"></div>
      <div style="position: absolute; left: 360px; top: 202px; width: 152px; height: 62px; background: #1d232c; border-radius: 3px;"></div>
      <div style="position: absolute; left: 470px; top: 96px; width: 38px; height: 38px; background: #2a3038; border-radius: 50%;"></div>
      <div style="position: absolute; left: 473px; top: 136px; width: 33px; height: 88px; background: #2a3038; border-radius: 12px;"></div>
      <div style="position: absolute; left: 464px; top: 90px; width: 51px; height: 142px; border: 2px solid #00ff00;"></div>
      <div style="position: absolute; left: 356px; top: 198px; width: 160px; height: 70px; border: 4px solid #ff0000;"></div>
      <div style="position: absolute; left: 22px; top: 116px; width: 248px; height: 128px; border: 2px solid #00ffff;"></div>
    </div>

    <div style="height: 78px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 20px 16px 20px; box-sizing: border-box;">
      <div style="display: flex; align-items: center; justify-content: center; height: 52px; padding: 0 24px; border: 1px solid #2a313b; color: #d7dce2; font-size: 17px;">Show the clip</div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
